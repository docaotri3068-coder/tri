<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tặng Nghi ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: #020108;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    user-select: none;
    touch-action: none; /* Ngăn cuộn trang khi vuốt */
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

#message {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 100%;
    text-align: center;
    color: white;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.85);
    transition: opacity 1.8s ease, transform 1.8s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    z-index: 10;
}

#message.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
}

p {
    font-size: clamp(22px, 4.8vw, 44px);
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #ffffff;
    text-shadow: 
        0 0 10px rgba(255, 20, 147, 0.8),
        0 0 25px rgba(255, 20, 147, 0.5),
        0 0 50px rgba(186, 85, 211, 0.4);
}
</style>
</head>

<body>

<canvas id="space"></canvas>

<div id="message">
    <p>TUI THÍCH NGHI ❤️</p>
</div>

<script>
const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");
const message = document.getElementById("message");

let W, H, scale, cx, cy;
let particles = [];
let burstParticles = [];
let stars = [];
let meteors = [];

let startTime = performance.now();
let lastTime = 0;
let meteorTimer = 0;

// Góc xoay 3D
let angleX = 0;
let angleY = 0;
let velX = 0;
let velY = 0;

// Trạng thái vuốt/kéo
let isDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;

function startDrag(x, y) {
    isDragging = true;
    lastMouseX = x;
    lastMouseY = y;
    velX = 0;
    velY = 0;
}

function moveDrag(x, y) {
    if (!isDragging) return;
    const dx = x - lastMouseX;
    const dy = y - lastMouseY;

    // Cập nhật góc xoay trực tiếp theo chuyển động vuốt
    angleY += dx * 0.008;
    angleX -= dy * 0.008;

    velY = dx * 0.008;
    velX = -dy * 0.008;

    lastMouseX = x;
    lastMouseY = y;

    if (Math.hypot(dx, dy) > 3) {
        createSparkles(x, y, 2);
    }
}

function stopDrag() {
    isDragging = false;
}

// Sự kiện Chuột & Cảm ứng vuốt xoay 3D
window.addEventListener("mousedown", (e) => {
    startDrag(e.clientX, e.clientY);
    createSparkles(e.clientX, e.clientY, 15);
});
window.addEventListener("mousemove", (e) => moveDrag(e.clientX, e.clientY));
window.addEventListener("mouseup", stopDrag);

window.addEventListener("touchstart", (e) => {
    if (e.touches.length > 0) {
        startDrag(e.touches[0].clientX, e.touches[0].clientY);
        createSparkles(e.touches[0].clientX, e.touches[0].clientY, 15);
    }
}, { passive: true });

window.addEventListener("touchmove", (e) => {
    if (e.touches.length > 0) {
        moveDrag(e.touches[0].clientX, e.touches[0].clientY);
    }
}, { passive: true });

window.addEventListener("touchend", stopDrag);

// Vệt hạt lấp lánh bắn ra khi chạm vuốt
function createSparkles(x, y, count) {
    for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 1 + Math.random() * 3.5;
        burstParticles.push({
            x: x,
            y: y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            size: 0.8 + Math.random() * 1.5,
            alpha: 1,
            decay: 0.02 + Math.random() * 0.02,
            color: Math.random() < 0.6 ? "#ff1493" : "#ba55d3"
        });
    }
}

// Công thức toán học tạo điểm bề mặt Trái tim chuẩn
function heartPoint(t) {
    return {
        x: 16 * Math.pow(Math.sin(t), 3),
        y: 13 * Math.cos(t)
          - 5 * Math.cos(2 * t)
          - 2 * Math.cos(3 * t)
          - Math.cos(4 * t)
    };
}

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = W * dpr;
    canvas.height = H * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    cx = W / 2;
    cy = H / 2 - 15;

    scale = Math.min(W / 38, H / 34, 18);

    createParticles();
    createStars();
}

// TẠO HẠT KHỐI THỂ TÍCH 3D CHÂN THỰC
function createParticles() {
    particles = [];
    const count = Math.min(4500, Math.floor((W * H) / 160));

    for (let i = 0; i < count; i++) {
        const t = Math.random() * Math.PI * 2;
        const pt = heartPoint(t);

        // Bề dày thể tích 3D dựa trên khoảng cách từ tâm đến viền
        const distFromCenter = Math.hypot(pt.x, pt.y) / 16;
        const maxDepth = Math.sin(Math.PI * distFromCenter) * 7 + 1.5; 

        // Phân bố hạt trong lòng khối 3D (3D Mesh Volume)
        const depthFactor = (Math.random() - 0.5) * 2;
        const tz = depthFactor * maxDepth;

        // Tạo độ dày nhẹ bề mặt
        const surfaceSpread = (1 - Math.abs(depthFactor)) * (Math.random() - 0.5) * 1.5;
        const tx = pt.x + surfaceSpread;
        const ty = pt.y + surfaceSpread;

        const startAngle = Math.random() * Math.PI * 2;
        const startRadius = Math.random() * Math.max(W, H) * 0.7;

        particles.push({
            x: cx + Math.cos(startAngle) * startRadius,
            y: cy + Math.sin(startAngle) * startRadius,
            z: 0,
            baseX: tx * scale,
            baseY: -ty * scale,
            baseZ: tz * scale,
            size: 0.35 + Math.random() * 1.15,
            colorType: Math.random(),
            phase: Math.random() * Math.PI * 2,
            driftSpeed: 0.01 + Math.random() * 0.02,
            speed: 0.012 + Math.random() * 0.028
        });
    }
}

function createStars() {
    stars = [];
    const count = Math.min(250, Math.floor((W * H) / 3000));

    for (let i = 0; i < count; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: Math.random() * 1.2 + 0.2,
            phase: Math.random() * Math.PI * 2,
            speed: 0.01 + Math.random() * 0.025
        });
    }
}

function createMeteor() {
    if (meteors.length >= 6) return;

    meteors.push({
        x: Math.random() * (W + 300),
        y: Math.random() * H * 0.35 - 100,
        vx: -(4 + Math.random() * 5),
        vy: 2.8 + Math.random() * 3.5,
        life: 1,
        length: 70 + Math.random() * 90
    });
}

function animate(now) {
    const dt = Math.min((now - (lastTime || now)) / 16.67, 2);
    lastTime = now;
    const elapsed = (now - startTime) / 1000;

    // Giảm dần vận tốc xoay theo quán tính mượt
    if (!isDragging) {
        angleX += velX * dt;
        angleY += velY * dt;
        velX *= 0.95;
        velY *= 0.95;
        // Trôi tự do cực nhẹ khi không thao tác
        angleY += 0.0018 * dt;
    }

    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(2, 1, 8, 0.22)";
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = "lighter";

    // 1. Sao nền nhấp nháy
    for (const s of stars) {
        s.phase += s.speed * dt;
        const alpha = 0.15 + (Math.sin(s.phase) + 1) * 0.25;

        ctx.fillStyle = `rgba(215, 205, 255, ${alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    }

    const progress = Math.max(0, Math.min(1, (elapsed - 0.4) / 4.0));
    const easeProgress = progress * progress * (3 - 2 * progress);

    let beat = 1;
    if (progress >= 1) {
        beat = 1 + Math.sin(elapsed * 2.5) * 0.025 + Math.sin(elapsed * 5) * 0.015;
    }

    // Các ma trận quay 3D
    const cosX = Math.cos(angleX), sinX = Math.sin(angleX);
    const cosY = Math.cos(angleY), sinY = Math.sin(angleY);

    // 2. Tính toán vị trí hạt trong không gian 3D
    for (const p of particles) {
        p.phase += p.driftSpeed * dt;

        const wiggleX = Math.sin(p.phase) * 2.0;
        const wiggleY = Math.cos(p.phase * 1.1) * 2.0;

        const bx = p.baseX * beat + wiggleX;
        const by = p.baseY * beat + wiggleY;
        const bz = p.baseZ * beat;

        // Phép quay 3D quanh trục Y
        let x1 = bx * cosY + bz * sinY;
        let y1 = by;
        let z1 = -bx * sinY + bz * cosY;

        // Phép quay 3D quanh trục X
        let x2 = x1;
        let y2 = y1 * cosX - z1 * sinX;
        let z2 = y1 * sinX + z1 * cosX;

        // Chiếu 3D sang màn hình 2D
        const fov = 380;
        const scale3D = fov / (fov + z2);
        const targetX = cx + x2 * scale3D;
        const targetY = cy + y2 * scale3D;

        p.x += (targetX - p.x) * p.speed * dt;
        p.y += (targetY - p.y) * p.speed * dt;

        // Độ sâu Z xác định kích thước và độ phát sáng (Bloom)
        const depthAlpha = Math.max(0.15, Math.min(1, (z2 + 180) / 360));
        const alpha = (0.2 + (Math.sin(p.phase * 2) + 1) * 0.3) * (0.3 + 0.7 * easeProgress) * depthAlpha;
        const renderSize = Math.max(0.2, p.size * scale3D);

        if (p.colorType < 0.5) {
            ctx.fillStyle = `rgba(255, 30, 130, ${alpha})`;
        } else if (p.colorType < 0.75) {
            ctx.fillStyle = `rgba(180, 70, 235, ${alpha})`;
        } else if (p.colorType < 0.9) {
            ctx.fillStyle = `rgba(255, 160, 200, ${alpha})`;
        } else {
            ctx.fillStyle = `rgba(235, 240, 255, ${alpha * 0.8})`;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, renderSize, 0, Math.PI * 2);
        ctx.fill();
    }

    // 3. Vệt sáng khi vuốt chạm
    for (let i = burstParticles.length - 1; i >= 0; i--) {
        const bp = burstParticles[i];
        bp.x += bp.vx * dt;
        bp.y += bp.vy * dt;
        bp.vx *= 0.92;
        bp.vy *= 0.92;
        bp.alpha -= bp.decay * dt;

        if (bp.alpha <= 0) {
            burstParticles.splice(i, 1);
            continue;
        }

        ctx.fillStyle = bp.color;
        ctx.globalAlpha = bp.alpha;
        ctx.beginPath();
        ctx.arc(bp.x, bp.y, bp.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    // 4. Sao băng
    meteorTimer += dt;
    if (meteorTimer > 18) {
        createMeteor();
        meteorTimer = 0;
    }

    for (let i = meteors.length - 1; i >= 0; i--) {
        const m = meteors[i];
        m.x += m.vx * dt;
        m.y += m.vy * dt;
        m.life -= 0.006 * dt;

        const grad = ctx.createLinearGradient(
            m.x, m.y,
            m.x - m.vx * (m.length / 8),
            m.y - m.vy * (m.length / 8)
        );

        grad.addColorStop(0, "rgba(255, 255, 255, 0.9)");
        grad.addColorStop(0.25, "rgba(255, 100, 180, 0.6)");
        grad.addColorStop(1, "rgba(130, 40, 220, 0)");

        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x - m.vx * (m.length / 8), m.y - m.vy * (m.length / 8));
        ctx.stroke();

        if (m.life <= 0 || m.x < -200 || m.y > H + 200) {
            meteors.splice(i, 1);
        }
    }

    if (progress >= 1 && elapsed > 5.0) {
        message.classList.add("show");
    }

    requestAnimationFrame(animate);
}

window.addEventListener("resize", resize);

resize();
requestAnimationFrame(animate);
</script>

</body>
</html>
